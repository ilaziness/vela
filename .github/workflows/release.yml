name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runs-on: windows-latest
            artifact: Vela.exe
            archive: Vela_${{ github.ref_name }}_windows_amd64.zip
          - goos: linux
            goarch: amd64
            runs-on: ubuntu-latest
            artifact: Vela
            archive: Vela_${{ github.ref_name }}_linux_amd64.tar.gz
          - goos: darwin
            goarch: arm64
            runs-on: macos-latest
            artifact: Vela
            archive: Vela_${{ github.ref_name }}_darwin_arm64.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-s -w -X github.com/ilaziness/vela/internal/buildinfo.Version=${{ github.ref_name }} -X github.com/ilaziness/vela/internal/buildinfo.Mode=release" -o "bin/${{ matrix.artifact }}" .

      - name: Archive (zip)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          cd bin
          7z a "${{ matrix.archive }}" "${{ matrix.artifact }}"

      - name: Archive (tar)
        if: matrix.goos != 'windows'
        run: |
          tar -C bin -czf "bin/${{ matrix.archive }}" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
