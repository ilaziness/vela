name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runs-on: windows-latest
            cgo: "0"
            ldflags_extra: "-H windowsgui"
            artifact: Vela.exe
            archive: Vela_${{ github.ref_name }}_windows_amd64.zip
          - goos: linux
            goarch: amd64
            runs-on: ubuntu-latest
            cgo: "0"
            ldflags_extra: ""
            artifact: Vela
            archive: Vela_${{ github.ref_name }}_linux_amd64.tar.gz
          - goos: darwin
            goarch: arm64
            runs-on: macos-latest
            cgo: "1"
            ldflags_extra: ""
            artifact: Vela
            archive: Vela_${{ github.ref_name }}_darwin_arm64.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        shell: bash
        run: |
          mkdir -p bin
          go build -tags prod -trimpath -ldflags "-s -w ${{ matrix.ldflags_extra }} -X github.com/ilaziness/vela/internal/buildinfo.Version=${{ github.ref_name }} -X github.com/ilaziness/vela/internal/buildinfo.Mode=release -X github.com/ilaziness/vela/internal/buildinfo.GitInfo=$(git rev-parse --short=12 HEAD) -X github.com/ilaziness/vela/internal/buildinfo.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o "bin/${{ matrix.artifact }}" .

      - name: Install buildapp
        if: matrix.goos == 'darwin' || matrix.goos == 'windows'
        shell: bash
        run: |
          GO_GUI_VERSION=$(go list -m -f '{{.Version}}' github.com/go-gui-org/go-gui)
          go install github.com/go-gui-org/go-gui/cmd/buildapp@${GO_GUI_VERSION}
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Package macOS .app
        if: matrix.goos == 'darwin'
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          buildapp -platform darwin -o bin -name Vela \
            -id github.com.ilaziness.vela \
            -icon build/darwin/icons.icns \
            -version "$VERSION" \
            bin/Vela

      - name: Archive (zip) for macOS
        if: matrix.goos == 'darwin'
        run: |
          cd bin
          zip -r "${{ matrix.archive }}" Vela.app

      - name: Package Windows exe with icon
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          buildapp -platform windows -o bin -name Vela \
            -id github.com.ilaziness.vela \
            -icon build/windows/icon.ico \
            -version "$VERSION" \
            bin/Vela.exe
          # buildapp 生成 zip，找到并重命名为期望的文件名
          ls bin/*.zip
          mv bin/*.zip "bin/${{ matrix.archive }}"

      - name: Archive (tar)
        if: matrix.goos == 'linux'
        run: |
          tar -C bin -czf "bin/${{ matrix.archive }}" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum Vela_* > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: dist/**
          generate_release_notes: true
          draft: true
