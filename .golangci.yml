# golangci-lint v2 — https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bidichk
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - loggercheck
    - misspell
    - nilerr
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    govet:
      enable:
        - nilness
    loggercheck:
      zap: true
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      # Keep default revive rules; only disable ones that force Wails/API renames.
      rules:
        - name: exported
          disabled: true
        - name: var-naming
          disabled: true
        - name: package-comments
          disabled: true
    gosec:
      # High-signal only for this desktop SSH app; skip noisy exec/path/bounds/weak-hash/taint rules.
      includes:
        - G101 # hardcoded credentials
        - G106 # ssh.InsecureIgnoreHostKey
        - G108 # pprof exposed
        - G201 # SQL format string
        - G202 # SQL concatenation
        - G301 # directory permissions
        - G302 # file/chmod permissions
        - G305 # zip path traversal
        - G306 # file write permissions
        - G402 # TLS InsecureSkipVerify
        - G403 # short RSA key
        - G404 # weak random
        - G405 # DES/RC4
        - G406 # MD4/RIPEMD160
        - G407 # hardcoded IV/nonce
        - G408 # ssh.PublicKeyCallback misuse
        - G502 # crypto/des import
        - G503 # crypto/rc4 import
        - G504 # net/http/cgi import
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      # Wails platform scaffolding (not app business code).
      - ^build/
    rules:
      # Test fixtures often use dummy secrets/keys.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ilaziness/vela
  exclusions:
    generated: lax
    paths:
      - ^build/
