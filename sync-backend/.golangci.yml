# golangci-lint v2 — sync-backend (independent module)
# https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bidichk
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - misspell
    - nilerr
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    govet:
      enable:
        - nilness
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    gosec:
      # High-signal rules for the HTTP sync server; skip noisy path/exec/taint noise.
      includes:
        - G101 # hardcoded credentials
        - G102 # bind to all interfaces
        - G108 # pprof exposed
        - G112 # ReadHeaderTimeout
        - G114 # serve without timeouts
        - G201 # SQL format string
        - G202 # SQL concatenation
        - G301 # directory permissions
        - G302 # file/chmod permissions
        - G306 # file write permissions
        - G402 # TLS InsecureSkipVerify
        - G404 # weak random
        - G405 # DES/RC4
        - G502 # crypto/des import
        - G503 # crypto/rc4 import
        - G504 # net/http/cgi import
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test fixtures often use dummy secrets/keys.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ilaziness/vela/sync-backend
  exclusions:
    generated: lax
